# Reverse proxy with TLS. Put this in /etc/nginx/sites-available/domain-scanner,
# symlink into sites-enabled, then run certbot to fill in the certificate paths.

# Must sit at http-context level. Files in sites-enabled are included inside
# the http block, so declaring it here (outside any server{}) is correct.
limit_req_zone $binary_remote_addr zone=scanner_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name scanner.example.com;          # <-- your domain

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name scanner.example.com;          # <-- your domain

    # certbot --nginx fills these in
    ssl_certificate     /etc/letsencrypt/live/scanner.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scanner.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # A scan of 50 domains can take a few minutes; the API returns immediately
    # and the UI polls, but keep these generous anyway.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 1m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Slow down brute-forcing the token without getting in your own way.
    location /api/session {
        limit_req zone=scanner_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}

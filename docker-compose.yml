services:
  scanner:
    build: .
    image: domain-scanner:latest
    restart: unless-stopped
    # Bound to localhost: nginx terminates TLS and proxies in. Set SCANNER_PORT
    # in .env if 8000 is already taken by something else on this host.
    ports:
      - "127.0.0.1:${SCANNER_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # A named volume, not a bind mount. Docker initialises a named volume
      # with the image's ownership, so the unprivileged container can write to
      # it. A bind-mounted ./data would be created root-owned by the daemon and
      # the container could not open the database at all.
      # Back up with:  docker compose cp scanner:/app/data/scanner.db ./backup.db
      - scanner-data:/app/data
    # Blocklists refuse queries from public resolvers (8.8.8.8, 1.1.1.1), so
    # point the container at a resolver that will answer. Your VPS provider's
    # resolver is usually the right choice.
    dns:
      - 1.1.1.1
    security_opt:
      - no-new-privileges:true

volumes:
  scanner-data:
